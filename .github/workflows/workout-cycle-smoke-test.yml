# Installs the Workout Cycle app on an Android emulator and checks that it launches,
# the Done button advances the cycle, and the Manage exercises screen opens.
name: Workout Cycle smoke test

on:
  push:
    paths:
      - "workout-tracker/**"
      - ".github/workflows/workout-cycle-smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: workout-cycle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: workout-tracker
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator and tap through
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: bash workout-tracker/scripts/smoke-test.sh workout-tracker/app/build/outputs/apk/debug/app-debug.apk
