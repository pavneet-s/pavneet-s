# Installs the Workout Cycle app on an Android emulator: first the previous release, then the
# new build over it, checking saved progress survives the upgrade and the main flows still work.
name: Workout Cycle smoke test

on:
  push:
    paths:
      - "workout-tracker/**"
      - ".github/workflows/workout-cycle-smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: workout-cycle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The first release installed on a phone (database version 1). Upgrades are tested from it.
      BASELINE_REF: 2aafd6142b302d204f5af4d83c659328796235d3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baseline commit is needed too

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: workout-tracker
        run: ./gradlew :app:assembleDebug

      - name: Build the previous release
        run: |
          git worktree add "$RUNNER_TEMP/baseline" "$BASELINE_REF"
          (cd "$RUNNER_TEMP/baseline/workout-tracker" && ./gradlew :app:assembleDebug)
          cp "$RUNNER_TEMP/baseline/workout-tracker/app/build/outputs/apk/debug/app-debug.apk" baseline.apk
          # Collect every exported database schema in one place for the artifact below.
          cp -r "$RUNNER_TEMP/baseline/workout-tracker/app/schemas/." workout-tracker/app/schemas/

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade on an emulator and tap through
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: bash workout-tracker/scripts/smoke-test.sh baseline.apk workout-tracker/app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload database schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: workout-tracker/app/schemas/
