# Builds the Workout Cycle Android app on GitHub's servers, so no computer is needed.
# Each run publishes the installable file at:
# https://github.com/pavneet-s/pavneet-s/releases/download/workout-cycle-latest/workout-cycle.apk
name: Workout Cycle APK

on:
  push:
    paths:
      - "workout-tracker/**"
      - ".github/workflows/workout-cycle-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release

concurrency:
  group: workout-cycle-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk workout-cycle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: workout-cycle-apk
          path: workout-tracker/workout-cycle.apk

      - name: Publish phone download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete workout-cycle-latest --yes --cleanup-tag || true
          gh release create workout-cycle-latest workout-cycle.apk \
            --target "$GITHUB_SHA" \
            --title "Workout Cycle (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Open this page on your phone and tap workout-cycle.apk to install."
