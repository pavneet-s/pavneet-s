# Builds the Workout Cycle app on GitHub's servers, tests that exact APK on an Android
# emulator, and only then publishes it, so the phone download link never gets a broken build:
# https://github.com/pavneet-s/pavneet-s/releases/download/workout-cycle-latest/workout-cycle.apk
name: Workout Cycle APK

on:
  push:
    paths:
      - "workout-tracker/**"
      - ".github/workflows/workout-cycle-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workout-cycle-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk workout-cycle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: workout-cycle-apk
          path: workout-tracker/workout-cycle.apk

  # Installs the previous release, makes progress, upgrades to the new APK in place (running any
  # database migration) and taps through the main flows. See workout-tracker/scripts/smoke-test.sh.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Releases that may be on a phone, oldest first: the first one (database version 1), the
      # cable-animation one (version 2) and the set-logging one (version 3). The new build is
      # installed over each in turn.
      BASELINE_REFS: >-
        2aafd6142b302d204f5af4d83c659328796235d3
        75de3f06c8a42701650eb8bad417e4871697c486
        573765970d89824466b8a5eb3af5a4fe704bdc68
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baseline commit is needed too

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: workout-cycle-apk

      - name: Build the previous releases
        run: |
          i=0
          for ref in $BASELINE_REFS; do
            i=$((i + 1))
            git worktree add "$RUNNER_TEMP/baseline-$i" "$ref"
            (cd "$RUNNER_TEMP/baseline-$i/workout-tracker" && ./gradlew :app:assembleDebug)
            cp "$RUNNER_TEMP/baseline-$i/workout-tracker/app/build/outputs/apk/debug/app-debug.apk" "baseline-$i.apk"
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade on an emulator and tap through
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: bash workout-tracker/scripts/smoke-test.sh workout-cycle.apk screenshots baseline-1.apk baseline-2.apk baseline-3.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshots/
          if-no-files-found: ignore

  publish:
    needs: emulator-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to replace the release that holds the APK
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workout-cycle-apk

      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-screenshots
          path: screenshots

      - name: Publish phone download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete workout-cycle-latest --yes --cleanup-tag || true
          gh release create workout-cycle-latest workout-cycle.apk screenshots/*.png \
            --target "$GITHUB_SHA" \
            --title "Workout Cycle (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME} and tested on an emulator; its screenshots are attached. Open this page on your phone and tap workout-cycle.apk to install."
